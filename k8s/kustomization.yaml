# Deploy everything:  kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resolveai
labels:
  - pairs:
      app.kubernetes.io/part-of: resolveai
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - api.yaml
  - web.yaml
# Point at a registry for a real cluster, e.g.:
#   kustomize edit set image resolveai-api=ghcr.io/<you>/resolveai-api:<tag>
images:
  - name: resolveai-api
    newTag: local
  - name: resolveai-web
    newTag: local
